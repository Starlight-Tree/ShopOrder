name: CI

# テストとビルドだけを行う。デプロイは含まない。外部の API（Gemini・決済など）は呼ばない。
# アクションは、改ざんされたタグを掴まないよう、コミット SHA で固定している（JobNavi の ci.yml と同じ。コメントは対応するタグ）。
# Go の版は backend/go.mod、Node の版は .node-version から読む（scripts/check-versions.sh が各ファイルとの整合を確かめる）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Go, Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DB を使うテストのための、使い捨ての Postgres。テスト専用のダミーの認証情報で、秘密情報は入っていない。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # backend/testutil_test.go は、この URL で接続して、テスト用の DB（shop_order_go_*）を作る。無いと DB のテストは静かにスキップされる。
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false  # 後続のステップで git の認証は使わない
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt で整えていないファイル:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      # 外部のサービスは呼ばない。旧 Python の API の応答（testdata/golden_api.json）を再生して比べる検査と、チャットの評価（eval_test.go）を含む。
      - name: Run go test
        run: |
          set -o pipefail
          go test -race -count=1 -v ./... | tee gotest.log
      # TEST_DATABASE_URL の綴りがずれると、テストはスキップされたまま green になる。スキップが 1 件でもあれば落とす。
      - name: No test may be skipped
        run: |
          if grep -qE '^[[:space:]]*--- SKIP' gotest.log; then
            echo "スキップされたテストがある。gotest.log の SKIP の行で理由を確かめる（DB の設定など）" >&2
            grep -E '^[[:space:]]*--- SKIP' gotest.log >&2
            exit 1
          fi

  backend-image:
    name: Backend image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          push: false
          load: true
          tags: shoporder-api:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      # DB が無いと API は起動しない（接続プールを開くため）ので、起動はしない。イメージの中のバイナリが動くこと（設定が無いと、固定の文で止まる）だけ確かめる。
      - name: Run the binary inside the image
        run: |
          set +e
          out="$(docker run --rm shoporder-api:ci migrate 2>&1)"
          code=$?
          echo "$out"
          [ "$code" -eq 1 ] && grep -q 'DATABASE_URL が未設定です' <<<"$out"
      # docker-compose.yml の構文と、環境変数の既定値を確かめる（起動はしない。.env は不要）
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  frontend:
    name: Frontend (Next.js) tests, build and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build
      # typecheck は build の後（.next/types を使う）
      - name: Type-check
        run: npm run typecheck

  # 実ブラウザー（Chromium）での通し（frontend/e2e/）。使い捨ての Postgres に、API（backend/ の `go run . e2e-server`。ダミーの履歴つき）と
  # 画面（next build → next start）を立てる。決済・配達・通知・チャットは模擬。外部の API は呼ばない。
  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # e2e-server が、この URL で接続して shop_order_e2e を作り直す（backend/guards.go が対象を検査する）
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
      # 失敗したときのトレースと HTML レポート（個人情報は含まない。データはすべてダミー）
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  versions:
    name: Version check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Go と Node の版が、Dockerfile・Compose・engines・CLAUDE.md・この CI で揃っているか
      - name: Go and Node versions agree
        run: scripts/check-versions.sh
