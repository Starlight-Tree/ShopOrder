# ShopOrder のローカル開発用（Postgres 17 + FastAPI + Next.js）。
#   docker compose up -d --build    # 起動（マイグレーションもダミーデータも流さない）
#   初めての環境は、先に README の「Quick start」の手順（db → migrate → seed）を実行する
#   http://localhost:3400            # 画面
#   http://localhost:8400/docs       # API の仕様（FastAPI の自動文書）
# 他のローカルのサービス（JobNavi 3200/8200、DocuNavi 3000）と同時に動かせるよう、ポートは 3400 / 8400 にしてある。変えない。
name: shop-order

services:
  # 店・注文などのデータ。ホストにポートを公開せず、internal の backend-net（外へも出られない）にだけ置く。
  db:
    image: postgres:17
    container_name: shop-order-db
    environment:
      POSTGRES_DB: shop_order
      POSTGRES_USER: shop_order
      POSTGRES_PASSWORD: "${LOCAL_DB_PASSWORD:-oasis-local}"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      # -h 127.0.0.1: 初回の初期化中の一時サーバー（ソケットだけ待ち受ける）を、起動済みと見なさないため
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop_order -d shop_order"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- 次の 2 つは「道具」（profile: tools）。docker compose up では起動しない。必要なときに docker compose run --rm <名前> で 1 回だけ実行する ---

  # マイグレーション（番号付き SQL。適用の前に DB のバックアップを取る: docs/development.md）。--status / --dry-run が使える
  migrate:
    build: ./backend
    container_name: shop-order-migrate
    profiles: ["tools"]
    command: ["python", "-m", "app.migrate"]
    environment:
      DATABASE_URL: &database_url "postgresql://shop_order:${LOCAL_DB_PASSWORD:-oasis-local}@db:5432/shop_order"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
    restart: "no"

  # ダミーのデータ（店・メニュー）を入れる（開発・テスト専用。DEMO_DATA=allow が無いと実行を拒否する。入れ直すときは --reset）
  seed:
    build: ./backend
    container_name: shop-order-seed
    profiles: ["tools"]
    command: ["python", "-m", "app.seed_demo"]
    environment:
      DATABASE_URL: *database_url
      DEMO_DATA: allow
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
    restart: "no"

  api:
    build: ./backend
    container_name: shop-order-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/code/app"]
    environment:
      DATABASE_URL: *database_url
      CORS_ORIGINS: "http://localhost:3400"
      # 差し替え口。既定はすべて模擬（docs/decisions/0005）。本物への切り替えは、承認を得てから .env（Git 管理外）に書く
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-mock}"
      DELIVERY_PROVIDER: "${DELIVERY_PROVIDER:-mock}"
      NOTIFIER: "${NOTIFIER:-inapp}"
      CHAT_MODEL: "${CHAT_MODEL:-mock}"
      # 開発の便宜（本番では使わない。APP_ENV=production のときは、AUTH_MODE=dev と ORDER_HOURS_CHECK=off の組み合わせで起動を拒否する）:
      #   AUTH_MODE=dev … 顧客はヘッダー X-Dev-User で入る（Google ログインは P6）。
      #   ORDER_HOURS_CHECK=off … 営業時間・定休日・ラストオーダー・販売時間帯を見ない（いつでも注文を試せる）。季節の期間と臨時休業は、off でも見る。
      #   ローカル時刻は LOCAL_UTC_OFFSET_HOURS（既定 9）。営業時間の判定と営業日に使う。
      APP_ENV: "development"
      AUTH_MODE: "dev"
      ORDER_HOURS_CHECK: "off"
      LOCAL_UTC_OFFSET_HOURS: "${LOCAL_UTC_OFFSET_HOURS:-9}"
    volumes:
      - ./backend/app:/code/app
    ports:
      - "127.0.0.1:8400:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # worker: 30 秒ごとに、支払い期限を過ぎた注文を取り消して在庫の確保を戻す（api と同じイメージ。python -m app.worker）。
  # API も読み取り・確定の前に同じ処理を遅延で呼ぶので、worker が止まっても在庫は固まらない。ポートは公開しない。
  worker:
    build: ./backend
    container_name: shop-order-worker
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: *database_url
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-mock}"
      LOCAL_UTC_OFFSET_HOURS: "${LOCAL_UTC_OFFSET_HOURS:-9}"
    volumes:
      - ./backend/app:/code/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
    restart: unless-stopped

  # 画面の開発サーバー（frontend/ の next dev）。API はサーバー側（Next.js）から呼ぶので、ブラウザーは API を直接呼ばない。
  frontend:
    image: node:24-slim
    container_name: shop-order-frontend
    working_dir: /app
    environment:
      API_BASE_URL: "http://api:8000"
    volumes:
      - ./frontend:/app
      # node_modules と .next は、ホストのものと分ける（ネイティブの依存が OS ごとに違うため）
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "127.0.0.1:3400:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend-net
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0 --port 3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

# frontend-net: frontend と api（frontend は npm ci で外へ出る）。
# backend-net: db と、api・道具（migrate・seed）。internal なので、db は外へ出られず、ホストからも届かない。
networks:
  frontend-net:
  backend-net:
    internal: true

volumes:
  pg-data:
  frontend_node_modules:
  frontend_next_cache:
